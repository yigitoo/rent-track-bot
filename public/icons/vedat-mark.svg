      <stop offset="0" stop-color="#4571f2"/>
      <stop offset="0.5" stop-color="#2b54d4"/>
      <stop offset="1" stop-color="#1b3688"/>
    </linearGradient>
    <radialGradient id="vg-sheen" cx="0.18" cy="0.06" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
