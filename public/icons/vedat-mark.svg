  <rect width="512" height="512" rx="118" fill="url(#vg-bg)"/>
  <rect width="512" height="512" rx="118" fill="url(#vg-sheen)"/>

  <!-- V: sol kol kalın, sağ kol biraz ince ve daha yüksek. Aşağıda birleşip
